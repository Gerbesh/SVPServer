name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - shell: powershell
        run: .\Package.ps1 -OutputPath "$env:RUNNER_TEMP\SVPServer-windows.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/SVPServer-windows.zip
          generate_release_notes: true
          draft: true
